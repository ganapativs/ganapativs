<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 348" width="1200" height="348" role="img" aria-labelledby="t d" font-kerning="normal">
<title id="t">Career since 2013: seven roles, one company since 2015</title>
<desc id="d">Timeline of seven roles since 2013. Intern, Web Frontend at Thinkappz from 2013; UI/UX Engineer at InvenZone from 2014; Software Engineer at Tracxn from 2015; Technology Lead at Tracxn from 2016; Associate VP, Technology at Tracxn from 2020; Senior Associate VP at Tracxn from 2022; VP, Technology at Tracxn from 2023, current. The Tracxn span begins in 2015 and covers four promotions.</desc>
