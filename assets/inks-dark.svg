<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 58" width="660" height="58" role="img" aria-labelledby="t d" font-kerning="normal">
<title id="t">Six inks, named after one city</title>
<desc id="d">Six colour swatches used across meetguns.com: bottle green, brass, oxblood, dust blue, aubergine, umber. This page is set in the first of them, bottle green.</desc>
<style>
.d{font-family:"Anek Latin","Helvetica Neue",Helvetica,Arial,sans-serif}
.s{font-family:Piazzolla,Georgia,"Times New Roman",serif}
.m{font-family:"Fragment Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.k{font-family:anekKannada,"Noto Sans Kannada","Nirmala UI","Tunga","Helvetica Neue",Arial,sans-serif}
text{fill:#efeee7}
.lbl{fill:#bebfb5}
.dim{fill:#91978a}
.acc{fill:#7dbf92}
.tk{letter-spacing:.14em}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<rect x="10" y="14" width="96.67" height="14" fill="#7dbf92"/>
<text class="m" x="10" y="44" font-size="9" fill="#91978a">bottle green</text>
<rect x="116.67" y="14" width="96.67" height="14" fill="#e2c376"/>
<text class="m" x="116.67" y="44" font-size="9" fill="#91978a">brass</text>
<rect x="223.33" y="14" width="96.67" height="14" fill="#e78c7f"/>
<text class="m" x="223.33" y="44" font-size="9" fill="#91978a">oxblood</text>
<rect x="330" y="14" width="96.67" height="14" fill="#85b2d9"/>
<text class="m" x="330" y="44" font-size="9" fill="#91978a">dust blue</text>
<rect x="436.67" y="14" width="96.67" height="14" fill="#c08acc"/>
<text class="m" x="436.67" y="44" font-size="9" fill="#91978a">aubergine</text>
<rect x="543.33" y="14" width="96.67" height="14" fill="#c19f88"/>
<text class="m" x="543.33" y="44" font-size="9" fill="#91978a">umber</text>
</svg>